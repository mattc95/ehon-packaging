backend:
  name: github
  repo: ehonpackaging/ehon-website
  branch: main
local_backend: true
site_url: https://www.ehonpackaging.com
display_url: https://www.ehonpackaging.com
media_folder: assets
public_folder: /assets
publish_mode: editorial_workflow
collections:
  - name: products
    label: Products
    label_singular: Product
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{category}}"
    fields:
      - { label: Title, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          - lipstick-packaging
          - mascara-packaging
          - eyeliner-packaging
          - lip-gloss-packaging
          - eyeshadow-packaging
          - powder-compacts
          - loose-powder-packaging
          - cream-jars-lotion-bottles
          - accessories
      - { label: Description, name: description, widget: text }
      - { label: Image, name: image, widget: image }
      - { label: Image alt, name: imageAlt, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Order, name: order, widget: number, default: 0, value_type: int }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Specs
        name: specs
        widget: list
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: string }
      - { label: Body, name: body, widget: markdown }
  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Section
        name: section
        widget: select
        options: [insights, guide, exhibition]
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Image, name: image, widget: image }
      - { label: Image alt, name: imageAlt, widget: string }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }
